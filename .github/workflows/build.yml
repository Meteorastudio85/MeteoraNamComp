name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -A x64

      - name: Configure (macOS, Universal)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          find build -type d -name "*.vst3" -path "*_artefacts*" -prune -exec cp -R {} dist/ \;
          if [ "$RUNNER_OS" == "macOS" ]; then
            find build -type d -name "*.component" -path "*_artefacts*" -prune -exec cp -R {} dist/ \;
            for b in dist/*.vst3 dist/*.component; do codesign --force --deep -s - "$b"; done
          fi
          cp README.md dist/
          ls -la dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MeteoraNamCompressor-${{ matrix.name }}
          path: dist
